name: Vídeo do pop-up
on:
  push:
    paths: ["video/popup.html", "video/render.mjs", ".github/workflows/video.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: node video/render.mjs
      - run: |
          ls -la video/*.mp4 video/*.jpg
          git config user.name "limamar-bot"; git config user.email "nathaemp@users.noreply.github.com"
          git add video/paraty-waters-popup.mp4 video/paraty-waters-popup.jpg
          git commit -m "Vídeo do pop-up renderizado [skip ci]" && git pull --rebase -q && git push
