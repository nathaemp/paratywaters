name: Verificar endereços
on:
  push:
    paths: [".github/workflows/verificar.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://limafilmsparaty.com/ https://www.limafilmsparaty.com/ https://www.limafilmsparaty.com/paratywaters https://www.limafilmsparaty.com/paratywaters/ https://www.limafilmsparaty.com/paratywaters/sw.js https://www.limafilmsparaty.com/paratywaters/cartas/cartas.json https://nathaemp.github.io/paratywaters/video/paraty-waters-popup.mp4; do
            echo "== $u"; curl -s -o /tmp/b -D - "$u" | grep -iE "^HTTP|^location|^server|^content-type|^cache-control|^cf-ray" ; head -c 300 /tmp/b | tr '\n' ' '; echo; done
          dig +short limafilmsparaty.com; dig +short www.limafilmsparaty.com
