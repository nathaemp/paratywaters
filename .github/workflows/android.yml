name: App Android
# Gera o instalável (.apk) do Paraty Waters e publica em
# https://github.com/nathaemp/paratywaters/releases/download/android/paraty-waters.apk
# Assinatura: a chave fica no repositório criptografada (app/keystore.enc) e só abre com o
# segredo ANDROID_SENHA, que só o dono do repositório conhece. Sem o segredo, sai um APK de teste.
on:
  push:
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: android
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SENHA: ${{ secrets.ANDROID_SENHA }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Instalar o Capacitor
        run: npm install --no-audit --no-fund

      - name: Criar o projeto Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0f5a6b' --splashBackgroundColor '#05141a' --splashBackgroundColorDark '#05141a'
          M=android/app/src/main/AndroidManifest.xml
          # GPS (velocidade, carta, alertas, âncora, homem ao mar) e vibração
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />#' $M
          grep -c ACCESS_FINE_LOCATION $M
          # número da versão sobe a cada build (o Android só atualiza se o número for maior)
          G=android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" $G
          grep -E "versionCode|versionName" $G
          npx cap sync android

      - name: Chave de assinatura
        if: env.SENHA != ''
        run: |
          if [ -f keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore.enc -out release.jks -pass env:SENHA
          else
            keytool -genkeypair -keystore release.jks -alias paratywaters -keyalg RSA -keysize 2048 -validity 12000 \
              -storepass "$SENHA" -keypass "$SENHA" -dname "CN=Paraty Waters, O=Lima Films, L=Paraty, ST=RJ, C=BR"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in release.jks -out keystore.enc -pass env:SENHA
            git config user.name "limamar-bot"; git config user.email "nathaemp@users.noreply.github.com"
            git add keystore.enc && git commit -m "Chave do app Android (criptografada) [skip ci]" && git pull --rebase -q && git push
          fi

      - name: Gerar o APK
        run: |
          cd android
          if [ -n "$SENHA" ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
          ls -la app/build/outputs/apk/*/

      - name: Assinar
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ -n "$SENHA" ]; then
            $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            $BT/apksigner sign --ks release.jks --ks-key-alias paratywaters --ks-pass env:SENHA --key-pass env:SENHA --out paraty-waters.apk aligned.apk
            NOME=paraty-waters.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk paraty-waters-teste.apk
            NOME=paraty-waters-teste.apk
          fi
          $BT/apksigner verify --print-certs $NOME | head -3
          ls -la $NOME
          echo "NOME=$NOME" >> $GITHUB_ENV

      - name: Publicar para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Paraty Waters para Android" \
            --notes "Instalável do Paraty Waters para Android. Baixe o arquivo paraty-waters.apk no celular e toque nele para instalar."
          gh release upload android "$NOME" --clobber
          echo "Link: https://github.com/${{ github.repository }}/releases/download/android/$NOME"
